name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and build
        run: |
          flutter create --org com.example --project-name currency_converter app
          cd app
          flutter pub add http
          cp ../main.dart lib/main.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$M"
          sed -i 's/android:label="[^"]*"/android:label="Currency Converter"/' "$M"
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CurrencyConverter-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk